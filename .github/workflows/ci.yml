name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pnpm install --frozen-lockfile

      - name: Typecheck and unit tests (TypeScript)
        run: |
          pnpm -r typecheck
          pnpm -r test

      - name: Unit tests (Python face-score)
        working-directory: services/face-score
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m pytest -q

      - name: Security rules tests (Firebase Emulator Suite)
        run: |
          npm install -g firebase-tools
          pnpm run test:rules

  # Deploy to dev on push to main will be added in this milestone once the owner provides the
  # Workload Identity Federation values (no long-lived keys in GitHub). See docs/setup-checklist.md.
