name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pnpm install --frozen-lockfile

      - name: Web copies of shared rules are in sync
        run: node scripts/sync-web-shared.mjs --check

      - name: Typecheck and unit tests (TypeScript)
        run: |
          pnpm -r typecheck
          pnpm -r test

      - name: Functions bundle builds
        run: pnpm --filter functions build

      - name: Unit tests (Python face-score)
        working-directory: services/face-score
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m pytest -q

      - name: Security rules tests (Firebase Emulator Suite)
        run: |
          npm install -g firebase-tools
          pnpm run test:rules

  # Deploy to dev on push to main. Authenticates with Workload Identity Federation (no keys in GitHub).
  # Only this repository on the main branch can act as sa-cicd (enforced in infra/terraform/wif.tf).
  # The web app itself deploys through Firebase App Hosting, which builds from the repository.
  deploy-dev:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/420016114828/locations/global/workloadIdentityPools/github/providers/github
          service_account: sa-cicd@book-dev-env.iam.gserviceaccount.com

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deploy security rules to dev
        run: |
          npm install -g firebase-tools
          firebase deploy --only firestore:rules,storage --project book-dev-env --non-interactive
